<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS — Hierarchical Academic Learning System</title>
  <style>
    :root {
      --bg: #09090b;
      --sidebar-bg: #0e0e11;
      --surface: #141418;
      --surface-hover: #1c1c22;
      --border: #24242c;
      --border-subtle: #1c1c22;
      --text: #f4f4f7;
      --text-muted: #8c8c9a;
      --text-faint: #555562;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.12);
      --success: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="light"] {
      --bg: #f8f9fa;
      --sidebar-bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f1f3f5;
      --border: #e6e8ec;
      --border-subtle: #f1f3f5;
      --text: #111116;
      --text-muted: #646473;
      --text-faint: #9ea0ad;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP HEADER */
    header {
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--text);
      color: var(--bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hierarchy-pill {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    .theme-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* MAIN APP LAYOUT (SPLIT TREE VIEW) */
    .app-layout {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      min-height: calc(100vh - 55px);
    }

    /* SIDEBAR (SUBJECTS & SECTIONS) */
    aside.sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-search-box {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .search-input-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.85rem 0.55rem 2.2rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-family: var(--font-sans);
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .sidebar-tree {
      overflow-y: auto;
      flex: 1;
      padding: 0.85rem;
    }

    .tree-subject-group {
      margin-bottom: 1.25rem;
    }

    .tree-subject-header {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      padding: 0.4rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tree-section-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .tree-section-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .tree-section-btn.active {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
    }

    .badge-num {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-faint);
      background: var(--border-subtle);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .tree-section-btn.active .badge-num {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* RIGHT CONTENT WORKSPACE */
    main.workspace {
      flex: 1;
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }

    /* BREADCRUMB */
    .breadcrumb-strip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 1rem;
    }

    .bc-sep {
      color: var(--text-faint);
    }

    .bc-active {
      color: var(--text);
      font-weight: 600;
    }

    .section-headline {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .section-description {
      font-size: 0.92rem;
      color: var(--text-muted);
      max-width: 800px;
      margin-bottom: 2rem;
    }

    /* CHAPTER BLOCK (ACCORDION / CONTAINER) */
    .chapter-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .chapter-block:hover {
      border-color: var(--border-hover);
    }

    .chapter-header {
      padding: 1.15rem 1.35rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .chapter-info h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .chapter-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .chapter-toggle-indicator {
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .chapter-block.collapsed .chapter-header {
      border-bottom: none;
    }

    .chapter-block.collapsed .chapter-toggle-indicator {
      transform: rotate(-90deg);
    }

    .chapter-block.collapsed .lectures-list {
      display: none;
    }

    /* LECTURES TABLE / LIST */
    .lectures-list {
      padding: 0.5rem 0;
    }

    .lecture-item {
      padding: 1rem 1.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease;
    }

    .lecture-item:last-child {
      border-bottom: none;
    }

    .lecture-item:hover {
      background: var(--surface-hover);
    }

    .lec-left {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      flex: 1;
    }

    .lec-code {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 2px;
    }

    .lec-title-text h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .lec-title-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .lec-tag-row {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .lec-tag {
      font-size: 0.7rem;
      color: var(--text-faint);
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
    }

    .lec-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-shrink: 0;
    }

    .lec-metrics {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-action-open {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
    }

    .lecture-item:hover .btn-action-open {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* UPCOMING PLACEHOLDER */
    .empty-chapter-msg {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-faint);
    }

    @media (max-width: 900px) {
      .app-layout {
        flex-direction: column;
      }
      aside.sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      main.workspace {
        padding: 1.5rem;
      }
    }
  </style>
</head>

            id: "comp-hardware",
            name: "Hardware, Memory & OS",
            desc: "CPU internal architecture, memory hierarchies (RAM/ROM/Cache), registers, and OS kernel basics.",
            chapters: [
              {
                id: "comp-ch1",
                code: "CH-01",
                title: "CPU Architecture & Memory Hierarchy",
                desc: "ALU, Control Unit, primary vs secondary memory, cache levels, and storage buses.",
                lectures: []
              }
            ]
          },
          {
            id: "comp-networks",
            name: "Networking, Protocols & Security",
            desc: "OSI 7-layer model, TCP/IP, IP addressing, cyber security protocols, and shortcuts.",
            chapters: [
              {
                id: "comp-ch2",
                code: "CH-01",
                title: "Networking Models & Internet Protocols",
                desc: "HTTP, HTTPS, FTP, DNS, SMTP, IPv4 vs IPv6, and firewall architectures.",
                lectures: []
              }
            ]
          }
        ]
      }
    ];

    /* CURRENT STATE */
    let currentSubjectId = "gs";
    let currentSectionId = "polity";

    /* THEME SWITCHER */
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', target);
    });

    /* RENDER SIDEBAR TREE */
    function renderSidebar() {
      const treeContainer = document.getElementById('sidebarTree');
      treeContainer.innerHTML = '';

      studyOSCurriculum.forEach(subject => {
        const groupEl = document.createElement('div');
        groupEl.className = 'tree-subject-group';

        // Calculate total lectures in this subject
        let subjectLecCount = 0;
        subject.sections.forEach(s => {
          s.chapters.forEach(c => {
            subjectLecCount += c.lectures.length;
          });
        });

        const headerEl = document.createElement('div');
        headerEl.className = 'tree-subject-header';
        headerEl.innerHTML = `
          <span>${subject.name}</span>
          <span style="font-size:0.68rem;">${subjectLecCount} active</span>
        `;
        groupEl.appendChild(headerEl);

        subject.sections.forEach(sec => {
          const btn = document.createElement('button');
          btn.className = `tree-section-btn ${subject.id === currentSubjectId && sec.id === currentSectionId ? 'active' : ''}`;
          
          let secLecCount = 0;
          sec.chapters.forEach(c => secLecCount += c.lectures.length);

          btn.innerHTML = `
            <span>${sec.name}</span>
            <span class="badge-num">${secLecCount}</span>
          `;

          btn.addEventListener('click', () => {
            currentSubjectId = subject.id;
            currentSectionId = sec.id;
            renderSidebar();
            renderWorkspace();
          });

          groupEl.appendChild(btn);
        });

        treeContainer.appendChild(groupEl);
      });
    }

    /* RENDER WORKSPACE ACCORDION VIEW */
    function renderWorkspace() {
      const subject = studyOSCurriculum.find(s => s.id === currentSubjectId);
      const section = subject.sections.find(sec => sec.id === currentSectionId);

      // Update Breadcrumb & Header
      document.getElementById('breadcrumbStrip').innerHTML = `
        <span>${subject.name}</span>
        <span class="bc-sep">/</span>
        <span class="bc-active">${section.name}</span>
      `;

      document.getElementById('sectionHeadline').textContent = section.name;
      document.getElementById('sectionDesc').textContent = section.desc;

      // Render Chapters
      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '';

      section.chapters.forEach((chapter, index) => {
        const block = document.createElement('div');
        block.className = `chapter-block ${chapter.lectures.length === 0 ? 'collapsed' : ''}`;
        block.setAttribute('data-chapter-id', chapter.id);

        const lecCount = chapter.lectures.length;

        block.innerHTML = `
          <div class="chapter-header" onclick="toggleChapter('${chapter.id}')">
            <div class="chapter-info">
              <h3>
                <span style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);">${chapter.code}</span>
                <span>${chapter.title}</span>
                <span class="badge-num">${lecCount} ${lecCount === 1 ? 'Lecture' : 'Lectures'}</span>
              </h3>
              <p>${chapter.desc}</p>
            </div>
            <div class="chapter-toggle-indicator">▼</div>
          </div>
          <div class="lectures-list" id="list_${chapter.id}">
            ${chapter.lectures.length > 0 ? chapter.lectures.map(lec => `
              <a href="${lec.url}" class="lecture-item">
                <div class="lec-left">
                  <span class="lec-code">${lec.id}</span>
                  <div class="lec-title-text">
                    <h4>${lec.title}</h4>
                    <p>${lec.desc}</p>
                    <div class="lec-tag-row">
                      ${lec.tags.map(t => `<span class="lec-tag">${t}</span>`).join('')}
                    </div>
                  </div>
                </div>
                <div class="lec-right">
                  <div class="lec-metrics">
                    <div>${lec.stages} Stages • ${lec.mcqs} MCQs</div>
                    <div style="color:var(--success);">${lec.flashcards} Flashcards</div>
                  </div>
                  <span class="btn-action-open">Launch ➔</span>
                </div>
              </a>
            `).join('') : `
              <div class="empty-chapter-msg">
                No lecture module added yet for this chapter. Upload your notes/PDF to automatically generate this module.
              </div>
            `}
          </div>
        `;

        container.appendChild(block);
      });
    }

    function toggleChapter(chId) {
      const block = document.querySelector(`[data-chapter-id="${chId}"]`);
      if (block) {
        block.classList.toggle('collapsed');
      }
    }

    /* SEARCH FILTER ACROSS ALL 4 TIERS */
    function handleSearch() {
      const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
      if (!query) {
        renderWorkspace();
        return;
      }

      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '';

      let matchesFound = 0;

      // Search entire curriculum
      studyOSCurriculum.forEach(subject => {
        subject.sections.forEach(section => {
          section.chapters.forEach(chapter => {
            const chapterMatches = chapter.title.toLowerCase().includes(query) || chapter.desc.toLowerCase().includes(query);
            const matchingLectures = chapter.lectures.filter(lec => 
              lec.title.toLowerCase().includes(query) ||
              lec.desc.toLowerCase().includes(query) ||
              lec.tags.some(t => t.toLowerCase().includes(query))
            );

            if (chapterMatches || matchingLectures.length > 0) {
              matchesFound++;
              const block = document.createElement('div');
              block.className = 'chapter-block';
              block.innerHTML = `
                <div class="chapter-header">
                  <div class="chapter-info">
                    <div style="font-size:0.75rem; font-family:var(--font-mono); color:var(--accent); margin-bottom:0.2rem;">
                      ${subject.name} ➔ ${section.name}
                    </div>
                    <h3>
                      <span style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);">${chapter.code}</span>
                      <span>${chapter.title}</span>
                    </h3>
                  </div>
                </div>
                <div class="lectures-list">
                  ${(matchingLectures.length > 0 ? matchingLectures : chapter.lectures).map(lec => `
                    <a href="${lec.url}" class="lecture-item">
                      <div class="lec-left">
                        <span class="lec-code">${lec.id}</span>
                        <div class="lec-title-text">
                          <h4>${lec.title}</h4>
                          <p>${lec.desc}</p>
                        </div>
                      </div>
                      <div class="lec-right">
                        <span class="btn-action-open">Launch ➔</span>
                      </div>
                    </a>
                  `).join('')}
                </div>
              `;
              container.appendChild(block);
            }
          });
        });
      });

      if (matchesFound === 0) {
        container.innerHTML = `
          <div class="empty-chapter-msg" style="padding:3rem;">
            No lectures or chapters found matching "${query}". Try searching for terms like "Schedules", "Cabinet Mission", or "Drafting".
          </div>
        `;
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderWorkspace();
    });
  </script>
</body>
</html>
