<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS — Universal Academic Learning Workspace</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-elevated: #17171c;
      --border: #222227;
      --border-hover: #383842;
      --text: #f4f4f7;
      --text-muted: #8b8b99;
      --text-faint: #565664;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.1);
      --success: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="light"] {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-elevated: #f1f3f5;
      --border: #e4e6eb;
      --border-hover: #cfd2d8;
      --text: #111116;
      --text-muted: #646473;
      --text-faint: #9ea0ad;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--text);
      color: var(--bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    .theme-btn:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    /* NAVIGATION BREADCRUMB & BACK STRIP */
    .nav-bar-strip {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      padding: 0.75rem 1.5rem;
    }

    .nav-bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .breadcrumb-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      overflow-x: auto;
      white-space: nowrap;
    }

    .bc-item {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .bc-item:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .bc-separator {
      color: var(--text-faint);
    }

    .bc-current {
      color: var(--text);
      font-weight: 600;
      cursor: default;
      text-decoration: none !important;
    }

    .btn-back {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
    }

    .btn-back:hover {
      background: var(--surface-elevated);
      border-color: var(--border-hover);
    }

    /* MAIN CONTENT VIEW CONTAINER */
    main.view-container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      flex: 1;
    }

    /* PAGE VIEW HEADINGS */
    .view-header {
      margin-bottom: 2rem;
    }

    .view-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .view-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .view-description {
      font-size: 0.92rem;
      color: var(--text-muted);
      max-width: 700px;
    }

    /* CARDS GRID SYSTEM (USED IN ALL VIEWS) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* DRILL-DOWN CARD STYLING */
    .drill-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      user-select: none;
    }

    .drill-card:hover {
      background: var(--surface-elevated);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .code-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .active-badge {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .card-title-text {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 0.45rem;
      line-height: 1.35;
    }

    .card-desc-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }

    .card-footer-row {
      border-top: 1px solid var(--border);
      padding-top: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .card-action-text {
      color: var(--text);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: gap 0.15s ease;
    }

    .drill-card:hover .card-action-text {
      color: var(--accent);
      gap: 0.55rem;
    }

    /* LECTURE ROW (LEVEL 4) */
    .lecture-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      transition: all 0.18s ease;
    }

    .lecture-card:hover {
      background: var(--surface-elevated);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .lec-details {
      flex: 1;
    }

    .lec-head-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.35rem;
    }

    .lec-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .lec-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 0.75rem;
    }

    .lec-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tag-item {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .lec-meta-action {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .lec-stats-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
    }

    .btn-launch-module {
      background: var(--accent);
      color: #ffffff;
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.15s ease;
    }

    .btn-launch-module:hover {
      opacity: 0.92;
      transform: translateX(2px);
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      background: var(--surface);
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      color: var(--text-faint);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* MOBILE ADJUSTMENT */
    @media (max-width: 640px) {
      .lecture-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .lec-meta-action {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border);
        padding-top: 0.85rem;
      }
    }
  </style>
</head>

              {
                id: "comp-ch2",
                code: "CH-01",
                title: "Networking Models & Internet Protocols",
                desc: "HTTP, HTTPS, FTP, DNS, SMTP, IPv4 vs IPv6, and firewall architectures.",
                lectures: []
              }
            ]
          }
        ]
      }
    ];

    /* ==========================================================
       ROUTER / NAVIGATION STATE CONTROLLER
       Current View Levels:
       - 'home' : List of Subjects
       - 'subject' : List of Sections for chosen Subject
       - 'section' : List of Chapters for chosen Section
       - 'chapter' : List of Lectures for chosen Chapter
    ========================================================== */
    let navState = {
      level: 'home',
      subjectId: null,
      sectionId: null,
      chapterId: null
    };

    function parseHash() {
      const hash = window.location.hash.replace('#', '');
      if (!hash || hash === 'home') {
        navState = { level: 'home', subjectId: null, sectionId: null, chapterId: null };
      } else {
        const parts = hash.split('/');
        if (parts.length === 1) {
          navState = { level: 'subject', subjectId: parts[0], sectionId: null, chapterId: null };
        } else if (parts.length === 2) {
          navState = { level: 'section', subjectId: parts[0], sectionId: parts[1], chapterId: null };
        } else if (parts.length === 3) {
          navState = { level: 'chapter', subjectId: parts[0], sectionId: parts[1], chapterId: parts[2] };
        }
      }
      renderCurrentView();
    }

    function navigateTo(level, sId, secId, chId) {
      if (level === 'home') {
        window.location.hash = 'home';
      } else if (level === 'subject') {
        window.location.hash = `${sId}`;
      } else if (level === 'section') {
        window.location.hash = `${sId}/${secId}`;
      } else if (level === 'chapter') {
        window.location.hash = `${sId}/${secId}/${chId}`;
      }
    }

    function navigateBack() {
      if (navState.level === 'chapter') {
        navigateTo('section', navState.subjectId, navState.sectionId);
      } else if (navState.level === 'section') {
        navigateTo('subject', navState.subjectId);
      } else if (navState.level === 'subject') {
        navigateTo('home');
      }
    }

    /* RENDER ENGINE */
    function renderCurrentView() {
      const appView = document.getElementById('appView');
      const breadcrumb = document.getElementById('breadcrumbTrail');
      const backBtn = document.getElementById('backBtn');

      window.scrollTo({ top: 0, behavior: 'smooth' });

      // ==========================================
      // LEVEL 1: HOME (SUBJECTS ONLY)
      // ==========================================
      if (navState.level === 'home') {
        backBtn.style.display = 'none';
        breadcrumb.innerHTML = `<span class="bc-current">Home (All Subjects)</span>`;

        appView.innerHTML = `
          <div class="view-header">
            <div class="view-eyebrow">Level 1 • Select Subject</div>
            <h1 class="view-title">Competitive Exam Subjects</h1>
            <p class="view-description">
              Tap a subject to explore its academic sections, chapters, and interactive learning modules.
            </p>
          </div>

          <div class="cards-grid">
            ${studyOSCurriculum.map(sub => {
              // Count lectures
              let totalLecs = 0;
              sub.sections.forEach(s => s.chapters.forEach(c => totalLecs += c.lectures.length));

              return `
                <div class="drill-card" onclick="navigateTo('subject', '${sub.id}')">
                  <div>
                    <div class="card-top-row">
                      <span class="code-tag">${sub.code}</span>
                      ${totalLecs > 0 ? `<span class="active-badge">${totalLecs} Active Modules</span>` : `<span style="font-size:0.7rem; color:var(--text-faint);">${sub.sections.length} Sections</span>`}
                    </div>
                    <h2 class="card-title-text">${sub.name}</h2>
                    <p class="card-desc-text">${sub.desc}</p>
                  </div>
                  <div class="card-footer-row">
                    <span style="color:var(--text-muted);">${sub.sections.length} Sections</span>
                    <span class="card-action-text">Explore Sections ➔</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      // ==========================================
      // LEVEL 2: SECTIONS VIEW
      // ==========================================
      const currentSubject = studyOSCurriculum.find(s => s.id === navState.subjectId);
      if (!currentSubject) {
        navigateTo('home');
        return;
      }

      if (navState.level === 'subject') {
        backBtn.style.display = 'inline-flex';
        breadcrumb.innerHTML = `
          <span class="bc-item" onclick="navigateTo('home')">Home</span>
          <span class="bc-separator">/</span>
          <span class="bc-current">${currentSubject.name}</span>
        `;

        appView.innerHTML = `
          <div class="view-header">
            <div class="view-eyebrow">Level 2 • Select Section in ${currentSubject.name}</div>
            <h1 class="view-title">${currentSubject.name} Sections</h1>
            <p class="view-description">${currentSubject.desc}</p>
          </div>

          <div class="cards-grid">
            ${currentSubject.sections.map(sec => {
              let secLecs = 0;
              sec.chapters.forEach(c => secLecs += c.lectures.length);

              return `
                <div class="drill-card" onclick="navigateTo('section', '${currentSubject.id}', '${sec.id}')">
                  <div>
                    <div class="card-top-row">
                      <span class="code-tag">${sec.code}</span>
                      ${secLecs > 0 ? `<span class="active-badge">${secLecs} Active Lectures</span>` : `<span style="font-size:0.7rem; color:var(--text-faint);">${sec.chapters.length} Chapters</span>`}
                    </div>
                    <h2 class="card-title-text">${sec.name}</h2>
                    <p class="card-desc-text">${sec.desc}</p>
                  </div>
                  <div class="card-footer-row">
                    <span style="color:var(--text-muted);">${sec.chapters.length} Chapters</span>
                    <span class="card-action-text">View Chapters ➔</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      // ==========================================
      // LEVEL 3: CHAPTERS VIEW
      // ==========================================
      const currentSection = currentSubject.sections.find(s => s.id === navState.sectionId);
      if (!currentSection) {
        navigateTo('subject', currentSubject.id);
        return;
      }

      if (navState.level === 'section') {
        backBtn.style.display = 'inline-flex';
        breadcrumb.innerHTML = `
          <span class="bc-item" onclick="navigateTo('home')">Home</span>
          <span class="bc-separator">/</span>
          <span class="bc-item" onclick="navigateTo('subject', '${currentSubject.id}')">${currentSubject.name}</span>
          <span class="bc-separator">/</span>
          <span class="bc-current">${currentSection.name}</span>
        `;

        appView.innerHTML = `
          <div class="view-header">
            <div class="view-eyebrow">Level 3 • Select Chapter in ${currentSection.name}</div>
            <h1 class="view-title">${currentSection.name}</h1>
            <p class="view-description">${currentSection.desc}</p>
          </div>

          <div class="cards-grid">
            ${currentSection.chapters.map(ch => {
              const lecCount = ch.lectures.length;
              return `
                <div class="drill-card" onclick="navigateTo('chapter', '${currentSubject.id}', '${currentSection.id}', '${ch.id}')">
                  <div>
                    <div class="card-top-row">
                      <span class="code-tag">${ch.code}</span>
                      ${lecCount > 0 ? `<span class="active-badge">${lecCount} Ready to Study</span>` : `<span style="font-size:0.7rem; color:var(--text-faint);">Upcoming</span>`}
                    </div>
                    <h2 class="card-title-text">${ch.title}</h2>
                    <p class="card-desc-text">${ch.desc}</p>
                  </div>
                  <div class="card-footer-row">
                    <span style="color:var(--text-muted);">${lecCount} ${lecCount === 1 ? 'Lecture' : 'Lectures'}</span>
                    <span class="card-action-text">Open Chapter ➔</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      // ==========================================
      // LEVEL 4: LECTURES VIEW (THE ACTUAL CONTENT)
      // ==========================================
      const currentChapter = currentSection.chapters.find(c => c.id === navState.chapterId);
      if (!currentChapter) {
        navigateTo('section', currentSubject.id, currentSection.id);
        return;
      }

      if (navState.level === 'chapter') {
        backBtn.style.display = 'inline-flex';
        breadcrumb.innerHTML = `
          <span class="bc-item" onclick="navigateTo('home')">Home</span>
          <span class="bc-separator">/</span>
          <span class="bc-item" onclick="navigateTo('subject', '${currentSubject.id}')">${currentSubject.name}</span>
          <span class="bc-separator">/</span>
          <span class="bc-item" onclick="navigateTo('section', '${currentSubject.id}', '${currentSection.id}')">${currentSection.name}</span>
          <span class="bc-separator">/</span>
          <span class="bc-current">${currentChapter.code}</span>
        `;

        appView.innerHTML = `
          <div class="view-header">
            <div class="view-eyebrow">Level 4 • Interactive Lectures in ${currentChapter.code}</div>
            <h1 class="view-title">${currentChapter.title}</h1>
            <p class="view-description">${currentChapter.desc}</p>
          </div>

          <div>
            ${currentChapter.lectures.length > 0 ? currentChapter.lectures.map(lec => `
              <div class="lecture-card">
                <div class="lec-details">
                  <div class="lec-head-row">
                    <span class="code-tag">${lec.id}</span>
                    <h2 class="lec-title">${lec.title}</h2>
                  </div>
                  <p class="lec-desc">${lec.desc}</p>
                  <div class="lec-tags">
                    ${lec.tags.map(t => `<span class="tag-item">${t}</span>`).join('')}
                  </div>
                </div>
                <div class="lec-meta-action">
                  <div class="lec-stats-label">
                    <div>${lec.stages} Stages • ${lec.mcqs} MCQs</div>
                    <div style="color:var(--success); font-weight:600;">${lec.flashcards} Flashcards</div>
                  </div>
                  <a href="${lec.url}" class="btn-launch-module">Launch Interactive Module ➔</a>
                </div>
              </div>
            `).join('') : `
              <div class="empty-state">
                <div class="empty-icon">📖</div>
                <h3 style="font-size:1.1rem; color:var(--text); margin-bottom:0.5rem;">No Lectures Uploaded Yet</h3>
                <p style="font-size:0.85rem; max-width:500px; margin:0 auto;">
                  Whenever you upload PDF notes or study material for this chapter, the automated system will generate the interactive learning module and link it here.
                </p>
              </div>
            `}
          </div>
        `;
      }
    }

    /* THEME SWITCHER */
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', target);
    });

    /* INITIALIZATION & ROUTING HOOKS */
    window.addEventListener('hashchange', parseHash);
    window.addEventListener('DOMContentLoaded', parseHash);
  </script>
</body>
</html>
